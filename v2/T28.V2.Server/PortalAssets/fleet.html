<script>
(()=>{
let csrf='',role='listener',managementAvailable=false,selected='',fleet=[],managed=new Map(),handoff='',activeAction=null,iqFeedback=null;
const main=document.querySelector('main'),receiverPanel=main.querySelector(':scope>.channel-card');main.classList.add('fleet-layout');receiverPanel.hidden=true;
const style=document.createElement('style');style.textContent='main.fleet-layout>.channel-card[hidden]{display:none}.fleet-sidebar{grid-column:1;grid-row:1}.fleet-list{display:grid;gap:.4rem;max-block-size:min(60vh,34rem);overflow:auto;padding:.15rem}.fleet-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem;padding:.65rem;border:1px solid var(--line);border-radius:.7rem;background:#0d181f;color:var(--ink);text-align:start}.fleet-row[aria-current=true]{border-color:var(--accent);background:#183b38}.fleet-row-name{overflow-wrap:anywhere;font-weight:800}.fleet-row-meta{display:flex;gap:.35rem;flex-wrap:wrap;color:var(--muted);font-size:.72rem}.fleet-count{color:var(--muted);font-size:.78rem}.fleet-management{display:grid;gap:.65rem;padding:.85rem}.fleet-secret{overflow-wrap:anywhere;color:var(--focus);font-family:ui-monospace,monospace;font-size:.75rem}.fleet-message{margin:0;color:var(--muted);font-size:.85rem;line-height:1.35}@media(min-width:46rem){main.fleet-layout{grid-template-columns:minmax(15rem,22rem) minmax(0,26rem);align-items:start;inline-size:min(100%,52rem)}main.channel-grid>.channel-card{grid-column:2;grid-row:1}.fleet-sidebar{position:sticky;inset-block-start:1rem}}@media(max-width:45.999rem){.fleet-list{max-block-size:18rem}}';document.head.append(style);
const runtimeStyle=document.createElement('style');runtimeStyle.textContent='.receiver-detail-body{display:grid;gap:.75rem;padding:.85rem}.receiver-detail-summary{display:grid;gap:.18rem}.receiver-detail-name{font-weight:800;overflow-wrap:anywhere}.receiver-detail-meta{color:var(--muted);font-size:.78rem;line-height:1.35}.fleet-runtime-actions,.receiver-management-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.receiver-management-actions{padding-block-start:.75rem;border-block-start:1px solid var(--line)}.receiver-rename-field{grid-column:1/-1}.receiver-management-actions #fleet-remove{grid-column:1/-1}.fleet-runtime-actions output{grid-column:1/-1;color:var(--muted);font-size:.8rem;line-height:1.3}.iq-capture-control{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15rem .55rem;align-items:center;padding:.7rem;border:1px solid var(--line);border-radius:.65rem}.iq-capture-control input{inline-size:1.15rem;block-size:1.15rem}.iq-capture-control small,.iq-capture-control output{grid-column:2;color:var(--muted);font-size:.75rem;line-height:1.3}.iq-capture-control output[data-state=error]{color:#ff9d9d}.iq-capture-control output[data-state=success]{color:var(--accent)}.fleet-runtime-actions button:disabled,.receiver-management-actions button:disabled{cursor:not-allowed;opacity:.55}@media(max-width:22rem){.fleet-runtime-actions,.receiver-management-actions{grid-template-columns:1fr}.receiver-rename-field,.receiver-management-actions #fleet-remove{grid-column:auto}}';document.head.append(runtimeStyle);
const side=document.createElement('aside');side.className='fleet-sidebar';side.innerHTML='<section class="channel-card" aria-label="Receiver fleet"><select id="receiver-selector" hidden aria-label="Receiver selection"></select><output id="receiver-connectivity" hidden></output><output id="receiver-state" hidden></output><output id="receiver-contact" hidden></output><output id="receiver-hardware" hidden></output><output id="receiver-revisions" hidden></output><input id="receiver-profile" hidden><button id="receiver-save" hidden type="button">Save configuration</button><button id="receiver-apply" hidden type="button">Apply configuration</button><button id="receiver-start" hidden type="button">Start receiver</button><button id="receiver-stop" hidden type="button">Stop receiver</button><output id="receiver-command-reason" hidden>Waiting for authoritative receiver state.</output><output id="receiver-command-outcome" hidden role="status" aria-live="polite"></output><details id="receiver-fleet" open><summary id="receiver-fleet-summary">Receiver fleet <span id="fleet-count" class="fleet-count">Loading</span></summary><div id="fleet-list" class="fleet-list" role="listbox" aria-label="Receivers"></div></details><output id="fleet-selected" class="effective" role="status" aria-live="polite">Loading receivers…</output><div id="fleet-management-host"></div></section></aside>';main.prepend(side);
const detail=document.createElement('details'),detailBody=document.createElement('div'),detailSummary=document.createElement('div'),detailName=document.createElement('strong'),detailMeta=document.createElement('span'),runtime=document.createElement('div'),iqControl=document.createElement('label'),detailManagement=document.createElement('div'),detailMessage=document.createElement('p'),startControl=side.querySelector('#receiver-start'),stopControl=side.querySelector('#receiver-stop'),commandOutcome=side.querySelector('#receiver-command-outcome'),managementHost=side.querySelector('#fleet-management-host');detail.id='receiver-details';detail.className='secondary';detail.open=false;detail.innerHTML='<summary>Receiver details</summary>';detailBody.className='receiver-detail-body';detailSummary.className='receiver-detail-summary';detailName.id='receiver-detail-name';detailName.className='receiver-detail-name';detailMeta.id='receiver-detail-meta';detailMeta.className='receiver-detail-meta';detailSummary.append(detailName,detailMeta);runtime.className='fleet-runtime-actions';iqControl.className='iq-capture-control';iqControl.innerHTML='<input id="iq-capture-enabled" type="checkbox"> <strong>Retain diagnostic raw IQ</strong><small>15 seconds before · complete transmission · 15 seconds after</small><output id="iq-capture-status" role="status" aria-live="polite"></output>';detailManagement.id='receiver-management-actions';detailManagement.className='receiver-management-actions';detailMessage.id='receiver-management-message';detailMessage.className='fleet-message';detailMessage.setAttribute('role','status');detailMessage.setAttribute('aria-live','polite');startControl.hidden=false;stopControl.hidden=false;commandOutcome.hidden=false;runtime.append(startControl,stopControl,commandOutcome);detailBody.append(detailSummary,runtime,iqControl,detailManagement,detailMessage);detail.append(detailBody);document.getElementById('admin').before(detail);
const $=id=>document.getElementById(id),message=(value,target='receiver',state='')=>{const output=$(target==='fleet'?'fleet-message':'receiver-management-message');if(output){output.textContent=value;output.dataset.state=state}},commandMessage=(value,state='')=>{commandOutcome.textContent=value;commandOutcome.dataset.state=state};
function beginAction(button,pendingLabel,pendingMessage,target='receiver'){if(activeAction||!button)return null;const token={button,id:selected,idleLabel:button.textContent,target};activeAction=token;button.textContent=pendingLabel;button.setAttribute('aria-busy','true');button.disabled=true;if(target==='command')commandMessage(pendingMessage,'pending');else message(pendingMessage,target,'pending');render();return token}
function endAction(token){if(activeAction!==token)return;token.button.textContent=token.idleLabel;token.button.setAttribute('aria-busy','false');activeAction=null;render();if(token.finalMessage)commandMessage(token.finalMessage[0],token.finalMessage[1])}
async function withAction(button,pendingLabel,pendingMessage,target,operation){const token=beginAction(button,pendingLabel,pendingMessage,target);if(!token)return null;try{return await operation(token.id,token)}catch(_){if(target==='command')token.finalMessage=['The receiver command could not be completed.','error'];else message('The requested action could not be completed. Check connectivity and try again.',target,'error');return null}finally{endAction(token)}}
function text(item){return (item.displayName||item.receiverId)+' — '+item.connectivity+' connectivity, '+(item.projectionCurrent?(item.projection?.state||'Unknown'):'Synchronizing')}
function healthText(current){const health=current?.projection?.health;if(!health)return current?.projectionCurrent?'Health awaiting receiver report':'Synchronizing';if(current?.projection?.state==='Faulted')return current.projection.faultCode==='orphan-suspected'?'RF shutdown incomplete':'SDR unavailable · retrying automatically';if(health.codecState==='faulted')return 'Audio codec faulted';if(health.recordingState==='faulted')return 'Gated recording faulted';return 'RF '+health.childState+' · audio '+health.codecState+' · recording '+health.recordingState}function syncManagementDraft(item){const input=$('fleet-rename-name');if(input&&document.activeElement!==input)input.value=item?.displayName||''}
function render(){const list=$('fleet-list'),active=fleet.filter(x=>x.connectivity==='Online').length,legacy=$('receiver-selector');legacy.replaceChildren(...fleet.map(item=>{const option=document.createElement('option');option.value=item.receiverId;option.textContent=item.displayName||item.receiverId;return option}));legacy.value=selected;legacy.onchange=()=>select(legacy.value);list.replaceChildren(...fleet.map(item=>{const row=document.createElement('button');row.type='button';row.className='fleet-row';row.disabled=!!activeAction;row.setAttribute('role','option');row.setAttribute('aria-current',String(item.receiverId===selected));row.setAttribute('aria-selected',String(item.receiverId===selected));row.dataset.receiverId=item.receiverId;row.innerHTML='<span class="fleet-row-name"></span><span class="fleet-row-meta"></span>';row.firstChild.textContent=item.displayName||item.receiverId;row.lastChild.textContent=item.connectivity+' · '+(item.projectionCurrent?(item.projection?.state||'Unknown'):'Synchronizing');row.onclick=()=>select(item.receiverId);row.onkeydown=e=>{const i=fleet.findIndex(x=>x.receiverId===item.receiverId);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const next=fleet[(i+(e.key==='ArrowDown'?1:fleet.length-1))%fleet.length];select(next.receiverId);setTimeout(()=>list.querySelector('[data-receiver-id="'+CSS.escape(next.receiverId)+'"]')?.focus(),0)}};return row}));$('fleet-count').textContent=active+' active / '+fleet.length+' total';const current=fleet.find(x=>x.receiverId===selected),managedCurrent=managed.get(selected);receiverPanel.hidden=!current;$('fleet-selected').textContent=current?'Selected: '+text(current):'No receiver selected';$('receiver-connectivity').textContent=current?.connectivity||'Offline';$('receiver-state').textContent=current?.projection?.state||'Unknown';$('receiver-contact').textContent=current?.lastAuthenticatedContact||'';$('receiver-hardware').textContent=current?.projection?.hardware||'';$('receiver-revisions').textContent=current?current.desiredRevision+'/'+current.sessionEpoch:'';detailName.textContent=current?.displayName||current?.receiverId||'No receiver selected';detailMeta.textContent=current?(current.connectivity+' · '+(current.projectionCurrent?(current.projection?.state||'Unknown'):'Synchronizing')+' · '+healthText(current)):'Select a receiver from the fleet';const toggle=$('fleet-toggle'),rename=$('fleet-rename'),remove=$('fleet-remove'),busy=!!activeAction;if(toggle&&!busy)toggle.textContent=managedCurrent?.lifecycleState==='Disabled'?'Re-enable receiver':'Disable receiver';if(rename)rename.disabled=busy||!managedCurrent;if(toggle)toggle.disabled=busy||!managedCurrent;if(remove)remove.disabled=busy||!managedCurrent;syncManagementDraft(managedCurrent)}
function renderRuntimeControls(){const current=fleet.find(item=>item.receiverId===selected),state=current?.projection?.state||'Unknown',ready=role==='admin'&&current?.connectivity==='Online'&&current?.projectionCurrent===true,busy=!!activeAction,iqToggle=$('iq-capture-enabled'),iqStatus=$('iq-capture-status');startControl.hidden=stopControl.hidden=commandOutcome.hidden=role!=='admin';startControl.disabled=busy||!ready||state!=='Stopped';stopControl.disabled=busy||!ready||state!=='Receiving';iqControl.hidden=role!=='admin';iqToggle.disabled=busy||!ready;if(activeAction?.target!=='iq')iqToggle.checked=current?.projection?.iqCaptureEnabled===true;if(role!=='admin'||activeAction?.target==='command')return;if(activeAction?.target!=='iq'){if(iqFeedback?.id===selected){iqStatus.textContent=iqFeedback.text;iqStatus.dataset.state=iqFeedback.state}else{iqStatus.textContent=ready?(iqToggle.checked?'Enabled; idle IQ is discarded until a transmission triggers retention.':'Disabled'):'Receiver is offline or synchronizing.';iqStatus.dataset.state=''}}commandMessage(ready?(state==='Stopped'?'Receiver is online and ready to start.':state==='Receiving'?'Receiver is receiving.':state==='Faulted'?'Receiver hardware is unavailable; retrying automatically.':'Receiver is '+state.toLowerCase()+'.'):'Receiver is offline or synchronizing.')}
const renderFleet=render;render=()=>{renderFleet();renderRuntimeControls()};
function collapseReceiverSections(){detail.open=false;const channelControls=$('admin');if(channelControls)channelControls.open=false}
function select(id){if(activeAction||!fleet.some(x=>x.receiverId===id))return;if(selected===id){collapseReceiverSections();return}selected=id;iqFeedback=null;collapseReceiverSections();const legacy=$('receiver-selector');legacy.value=id;legacy.dispatchEvent(new Event('change'));render();$('fleet-list').querySelector('[aria-current="true"]')?.scrollIntoView({block:'nearest'});document.dispatchEvent(new CustomEvent('t28-receiver-select',{detail:id}))}
function clearSelection(){selected='';collapseReceiverSections();receiverPanel.hidden=true}
window.addEventListener('pagehide',clearSelection);window.addEventListener('pageshow',()=>{clearSelection();render()});
async function lifecycleCommand(action,button){const starting=action==='StartReceiver';await withAction(button,starting?'Starting…':'Stopping…',starting?'Starting receiver and waiting for RF readiness…':'Stopping receiver and waiting for RF shutdown…','command',async(receiverId,token)=>{const receiver=await fetch('/v2/receivers/'+encodeURIComponent(receiverId),{credentials:'same-origin'}).then(response=>response.ok?response.json():null);if(!receiver?.currentBootId||!Number.isInteger(receiver.sessionEpoch)||!Number.isInteger(receiver.projection?.stateVersion)){token.finalMessage=['Receiver state is unavailable.','error'];return null}const response=await fetch('/v2/receivers/'+encodeURIComponent(receiverId)+'/commands/'+action,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-T28-V2-CSRF':csrf},body:JSON.stringify({requestId:crypto.randomUUID(),sessionEpoch:receiver.sessionEpoch,bootId:receiver.currentBootId,expectedStateVersion:receiver.projection.stateVersion,profileId:receiver.desiredProfileId||null,desiredRevision:receiver.desiredRevision})}),body=await response.json().catch(()=>null),accepted=response.ok&&body?.status==='applied';token.finalMessage=[accepted?(starting?'Receiver started and is receiving.':'Receiver stopped.'):'Receiver command was not accepted.',accepted?'success':'error'];await refresh();document.dispatchEvent(new CustomEvent('t28-receiver-refresh'));return body})}
$('receiver-start').onclick=()=>void lifecycleCommand('StartReceiver',$('receiver-start'));$('receiver-stop').onclick=()=>void lifecycleCommand('StopReceiver',$('receiver-stop'));
async function iqCaptureCommand(enabled){if(activeAction)return;const receiverId=selected,token={button:$('iq-capture-enabled'),id:receiverId,target:'iq'};activeAction=token;iqFeedback=null;token.button.disabled=true;$('iq-capture-status').textContent=enabled?'Enabling bounded IQ retention…':'Disabling IQ retention…';$('iq-capture-status').dataset.state='pending';render();try{const receiver=await fetch('/v2/receivers/'+encodeURIComponent(receiverId),{credentials:'same-origin'}).then(response=>response.ok?response.json():null);if(!receiver?.currentBootId||!Number.isInteger(receiver.sessionEpoch)||!Number.isInteger(receiver.projection?.stateVersion))throw Error();const response=await fetch('/v2/receivers/'+encodeURIComponent(receiverId)+'/iq-capture',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-T28-V2-CSRF':csrf},body:JSON.stringify({requestId:crypto.randomUUID(),sessionEpoch:receiver.sessionEpoch,bootId:receiver.currentBootId,expectedStateVersion:receiver.projection.stateVersion,enabled})}),body=await response.json().catch(()=>null);if(!response.ok||body?.status!=='applied')throw Error();await refresh();iqFeedback={id:receiverId,text:enabled?'Enabled; waiting for a transmission.':'Disabled',state:'success'}}catch(_){token.button.checked=!enabled;iqFeedback={id:receiverId,text:'The IQ capture setting could not be applied.',state:'error'}}finally{if(activeAction===token)activeAction=null;render()}}
$('iq-capture-enabled').onchange=event=>void iqCaptureCommand(event.currentTarget.checked);
function ensureManagement(){const host=$('fleet-management-host');if($('fleet-management'))return;host.innerHTML='<details id="fleet-management" class="secondary"><summary id="fleet-management-summary">Add receiver</summary><form id="fleet-add" class="fleet-management"><label>Friendly display name <input id="fleet-add-name" maxlength="80" required></label><button type="submit">Create enrolment</button><p id="fleet-message" class="fleet-message" role="status" aria-live="polite"></p><output id="fleet-handoff" class="fleet-secret" aria-live="polite"></output><button id="fleet-copy" type="button" hidden>Copy one-time handoff</button></form></details>';detailManagement.innerHTML='<label class="receiver-rename-field">Receiver name <input id="fleet-rename-name" maxlength="80"></label><button id="fleet-rename" type="button">Save name</button><button id="fleet-toggle" type="button">Disable receiver</button><button id="fleet-remove" type="button">Remove receiver</button>';const details=$('fleet-management'),sync=()=>details.querySelectorAll('input,button').forEach(control=>control.disabled=!details.open);details.addEventListener('toggle',sync);sync();bindManagement()}
async function refresh(){const response=await fetch('/v2/session',{method:'POST',credentials:'same-origin'});if(!response.ok)throw Error();const body=await response.json();csrf=body.csrf;role=body.role==='admin'?'admin':'listener';managementAvailable=body.managementAvailable===true;fleet=Array.isArray(body.fleet)?body.fleet:[];if(selected&&!fleet.some(x=>x.receiverId===selected))selected='';if(role==='admin'&&managementAvailable){ensureManagement();const managedResponse=await fetch('/v2/management/receivers',{credentials:'same-origin'});if(managedResponse.ok)managed=new Map((await managedResponse.json()).map(x=>[x.receiverId,x]))}else{$('fleet-management-host').replaceChildren();detailManagement.replaceChildren()}handoff='';if($('fleet-handoff')){$('fleet-handoff').textContent='';$('fleet-copy').hidden=true}render()}
async function mutation(path,body,target='receiver'){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-T28-V2-CSRF':csrf},body:JSON.stringify(body)});if(response.status===409){message('Receiver changed elsewhere. Refreshed authoritative state; review and retry.',target,'error');await refresh();return null}if(!response.ok){message('The requested receiver change was not accepted.',target,'error');return null}return response.json()}
function bindManagement(){$('fleet-add').onsubmit=async event=>{event.preventDefault();const name=$('fleet-add-name').value.trim(),button=event.submitter||$('fleet-add').querySelector('button[type=submit]');if(!name)return;const body=await withAction(button,'Creating…','Creating receiver enrolment…','fleet',()=>mutation('/v2/management/receivers',{displayName:name},'fleet'));if(!body)return;await refresh();select(body.receiver.receiverId);handoff=body.enrolmentCredential;$('fleet-handoff').textContent='One-time enrolment handoff: '+handoff;$('fleet-copy').hidden=false;$('fleet-add-name').value='';message('Receiver added. Copy the one-time handoff now; it will not be shown again after refresh.','fleet','success')};$('fleet-copy').onclick=async()=>{if(!handoff)return;await withAction($('fleet-copy'),'Copying…','Copying one-time handoff…','fleet',async()=>{try{await navigator.clipboard.writeText(handoff);message('One-time enrolment handoff copied.','fleet','success')}catch(_){message('Copy is unavailable here; select the displayed handoff to copy it.','fleet','error')}})};$('fleet-rename').onclick=async()=>{const item=managed.get(selected),name=$('fleet-rename-name')?.value.trim();if(!item||!name)return;await withAction($('fleet-rename'),'Saving…','Saving receiver name…','receiver',async receiverId=>{const body=await mutation('/v2/management/receivers/'+encodeURIComponent(receiverId)+'/rename',{expectedRevision:item.managementRevision,displayName:name});if(body){message('Receiver name saved.','receiver','success');await refresh()}})};$('fleet-toggle').onclick=async()=>{const item=managed.get(selected);if(!item)return;const operation=item.lifecycleState==='Disabled'?'enable':'disable';await withAction($('fleet-toggle'),operation==='enable'?'Enabling…':'Disabling…',(operation==='enable'?'Enabling':'Disabling')+' receiver…','receiver',async receiverId=>{const body=await mutation('/v2/management/receivers/'+encodeURIComponent(receiverId)+'/'+operation,{expectedRevision:item.managementRevision});if(body){message(operation==='enable'?'Receiver re-enabled.':body.lifecycleState==='RecoveryRequired'?'Receiver audio ended; a current Stop proof is still required.':'Receiver disabled after a current Stop proof.','receiver','success');await refresh()}})};$('fleet-remove').onclick=async()=>{const item=managed.get(selected);if(!item||!confirm('Remove '+(item.displayName||selected)+'? This retires only this receiver session and leaves a bounded audit tombstone.'))return;await withAction($('fleet-remove'),'Removing…','Removing receiver and waiting for safe retirement…','receiver',async receiverId=>{const body=await mutation('/v2/management/receivers/'+encodeURIComponent(receiverId)+'/decommission',{expectedRevision:item.managementRevision});if(body){message(body.lifecycleState==='Decommissioned'?'Receiver removed after a current Stop proof.':'Receiver audio ended; removal awaits a current Stop proof.','receiver','success');await refresh()}})}}
refresh().catch(()=>{$('fleet-selected').textContent='Receiver fleet unavailable.'});
document.addEventListener('t28-fleet-refresh',()=>void refresh());document.addEventListener('t28-fleet-snapshot',event=>{const body=event.detail;if(!body||!Array.isArray(body.fleet))return;fleet=body.fleet;if(selected&&!fleet.some(item=>item.receiverId===selected))selected='';render()});
})();
</script>
